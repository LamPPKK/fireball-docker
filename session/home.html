<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Fireball Session</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #f8fafc; background: #080b10; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(42rem, calc(100% - 3rem)); }
      p { color: #a8b1c2; line-height: 1.6; }
      strong { color: #ff8a3d; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <strong>Fireball isolated session</strong>
      <h1>Ready for a private navigation.</h1>
      <p>Use the controller omnibox to open a site. Session storage is mounted in volatile memory and is destroyed when the tenant burns this container.</p>
    </main>
  </body>
</html>
