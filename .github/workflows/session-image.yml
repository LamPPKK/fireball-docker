name: session-image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: session/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: fireball/session-wpe:test-${{ matrix.suffix }}
          cache-from: type=gha,scope=session-image-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=session-image-${{ matrix.suffix }}
      - name: Inspect WPE and rswebrtc plugins
        run: |
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint gst-inspect-1.0 "fireball/session-wpe:test-${{ matrix.suffix }}" wpesrc
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint gst-inspect-1.0 "fireball/session-wpe:test-${{ matrix.suffix }}" webrtcsink
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint gst-inspect-1.0 "fireball/session-wpe:test-${{ matrix.suffix }}" openh264enc
      - name: Inspect runtime metadata
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "fireball/session-wpe:test-${{ matrix.suffix }}")" = "10001:10001"
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint /usr/bin/node "fireball/session-wpe:test-${{ matrix.suffix }}" --check /opt/fireball-session/supervisor.mjs
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint /usr/bin/bwrap "fireball/session-wpe:test-${{ matrix.suffix }}" --version
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint test "fireball/session-wpe:test-${{ matrix.suffix }}" -x /usr/lib/fireball/bwrap.real
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint /bin/sh "fireball/session-wpe:test-${{ matrix.suffix }}" -eu -c "ldconfig -p | grep -F libGLESv2.so.2"
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint cat "fireball/session-wpe:test-${{ matrix.suffix }}" /usr/share/fireball-session/component-versions.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            session/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --prefix session --ignore-scripts
      - name: Load WPE user-namespace AppArmor profile
        run: sudo apparmor_parser -r deploy/apparmor/fireball-session
      - name: Prepare TURN smoke fixtures
        run: |
          sudo install -o root -g 10001 -m 0440 session/test/fixtures/ice-servers.json "/tmp/fireball-ice-${{ matrix.suffix }}.json"
          sudo install -o root -g 10001 -m 0444 session/test/fixtures/ice-servers.json "/tmp/fireball-ice-unsafe-${{ matrix.suffix }}.json"
      - name: Reject unsafe TURN secret permissions
        run: |
          set +e
          output="$(docker run --rm --platform "${{ matrix.platform }}" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /run/fireball-session:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001 \
            --mount "type=bind,source=/tmp/fireball-ice-unsafe-${{ matrix.suffix }}.json,target=/run/fireball-secrets/ice-servers.json,readonly" \
            --env FIREBALL_INTERNAL_SIGNALING_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            --env FIREBALL_ICE_SERVERS_FILE=/run/fireball-secrets/ice-servers.json \
            "fireball/session-wpe:test-${{ matrix.suffix }}" 2>&1)"
          status="$?"
          set -e
          test "$status" -ne 0
          grep -F "must be owned by root:10001 with mode 0440" <<<"$output"
      - name: Smoke running session container
        run: npm run container:smoke --prefix session -- "fireball/session-wpe:test-${{ matrix.suffix }}" "${{ matrix.platform }}"
        env:
          FIREBALL_SMOKE_APPARMOR_PROFILE: fireball-session
          FIREBALL_SMOKE_SECCOMP_PROFILE: ${{ github.workspace }}/deploy/seccomp/fireball-session.json
          FIREBALL_SMOKE_ICE_SERVERS_FILE: /tmp/fireball-ice-${{ matrix.suffix }}.json
      - name: Smoke two-tenant isolation through the orchestrator
        run: npm run session:isolation:smoke -- "fireball/session-wpe:test-${{ matrix.suffix }}" "${{ matrix.platform }}"
        env:
          FIREBALL_SMOKE_APPARMOR_PROFILE: fireball-session
          FIREBALL_SMOKE_SECCOMP_PROFILE: ${{ github.workspace }}/deploy/seccomp/fireball-session.json
          FIREBALL_SMOKE_ICE_SERVERS_FILE: /tmp/fireball-ice-${{ matrix.suffix }}.json
      - name: Remove TURN smoke fixtures
        if: always()
        run: sudo rm -f "/tmp/fireball-ice-${{ matrix.suffix }}.json" "/tmp/fireball-ice-unsafe-${{ matrix.suffix }}.json"
      - name: Report kernel sandbox denials
        if: failure()
        run: sudo journalctl --dmesg --since "10 minutes ago" --no-pager | grep -E -i 'apparmor|seccomp|audit.*denied' || true
